<!-- AdminLTE 로그인 페이지 레이아웃 -->
<div class="login-page">
  <div class="login-box">

    <!-- 로고 -->
    <div class="login-logo">
      <a href="#">
        <img src="assets/images/kubevirt-manager.png"
             alt="kubevirt-manager"
             class="login-logo-img"
             onerror="this.style.display='none'">
        <span class="login-logo-text">
          <b>KubeVirt</b>&nbsp;Manager
        </span>
      </a>
    </div>

    <!-- 로그인 카드 -->
    <div class="card">
      <div class="card-body login-card-body">

        <p class="login-box-msg">관리자 계정으로 로그인하세요.</p>

        <!-- 에러 메시지 -->
        <div *ngIf="errorMsg" class="alert alert-danger alert-dismissible mb-3">
          <button type="button" class="close" (click)="errorMsg = ''">
            <span aria-hidden="true">&times;</span>
          </button>
          <i class="fas fa-exclamation-circle mr-2"></i>{{ errorMsg }}
        </div>

        <!-- 로그인 폼 -->
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">

          <!-- 아이디 -->
          <div class="input-group mb-3">
            <input type="text"
                   class="form-control"
                   placeholder="아이디"
                   [(ngModel)]="username"
                   name="username"
                   autocomplete="username"
                   [disabled]="loading"
                   required>
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-user"></span>
              </div>
            </div>
          </div>

          <!-- 비밀번호 -->
          <div class="input-group mb-3">
            <input [type]="showPassword ? 'text' : 'password'"
                   class="form-control"
                   placeholder="비밀번호"
                   [(ngModel)]="password"
                   name="password"
                   autocomplete="current-password"
                   [disabled]="loading"
                   required>
            <div class="input-group-append">
              <button type="button"
                      class="btn btn-outline-secondary"
                      (click)="showPassword = !showPassword"
                      tabindex="-1">
                <i [ngClass]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
          </div>

          <!-- 로그인 버튼 -->
          <div class="row">
            <div class="col-12">
              <button type="submit"
                      class="btn btn-primary btn-block"
                      [disabled]="loading">
                <span *ngIf="loading">
                  <i class="fas fa-spinner fa-spin mr-1"></i>로그인 중...
                </span>
                <span *ngIf="!loading">
                  <i class="fas fa-sign-in-alt mr-1"></i>로그인
                </span>
              </button>
            </div>
          </div>

        </form>

        <!-- 안내 -->
        <p class="mt-3 mb-0 text-center text-muted" style="font-size:0.8rem;">
          <i class="fas fa-info-circle mr-1"></i>
          기본 계정: <code>admin</code> / <code>admin</code>
        </p>

      </div><!-- /login-card-body -->
    </div>

  </div><!-- /login-box -->
</div><!-- /login-page -->
