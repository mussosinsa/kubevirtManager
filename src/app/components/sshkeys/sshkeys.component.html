<div class="content">
    <div class="container-fluid">
      <div class="content-wrapper">
        &nbsp;<br>
        <div class="card card-outline">
          <div class="card-header">
            <h3 class="card-title">
              <i class="fas fa-key"></i>
              &nbsp;&nbsp;SSH 키
            </h3>
            <div class="card-tools">
              <button type="button" data-placement="bottom" data-toggle="tooltip" data-original-title="새로고침..." title="새로고침..." class="btn btn-tool" (click)="fullReload()">
                  <i class="fas fa-sync" (click)="fullReload()" title="새로고침..."></i>
              </button>
              <button type="button" data-placement="bottom" data-toggle="tooltip" data-original-title="새 키..." title="새 키..." class="btn btn-tool" (click)="showNew()">
                <i class="fas fa-plus-square"(click)="showNew()" title="새 키..."></i>
            </button>
            </div>
          </div>
          <div class="card-body">
           <table datatable id="sshList_datatable" [dtOptions]="sshList_dtOptions" [dtTrigger]="sshList_dtTrigger"class="table table-sm" style="vertical-align: middle !important;">
              <thead>
                <tr>
                  <th style="width: 10px">&nbsp;</th>
                  <th style="width: 60px">네임스페이스</th>
                  <th style="width: 100px">이름</th>
                  <th style="width: 150px">생성일</th>
                  <th style="width: 20px">&nbsp;</th>
                </tr>
              </thead>
              <tbody>
                  <tr *ngFor="let thisKey of keyList">
                    <td style="line-height: 2.2 !important; align-content: center;"><i class="fas fa-key"></i></td>
                    <td style="line-height: 2.2 !important;">{{thisKey.namespace}}</td>
                    <td style="line-height: 2.2 !important;">{{thisKey.name}}</td>
                    <td style="line-height: 2.2 !important;">{{thisKey.creationTimestamp}}</td>
                    <td style="line-height: 0 !important;">
                      <!--- DELETE BUTTON -->
                      <a class="btn" (click)="showDelete(thisKey.name, thisKey.namespace)" title="삭제...">
                        <i class="fas fa-trash" (click)="showDelete(thisKey.name, thisKey.namespace)" title="삭제..."></i>
                      </a>
                    </td>
                  </tr>
              </tbody>
            </table>
          </div>
          <!-- /.card-body -->
        </div>
      </div>


      <!--            -->
      <!-- Modal: New -->
      <!--            -->
      <div class="modal fade" id="modal-new" style="display: none;" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title" id="new-title">TITLE_TEMPLATE</h4>
              <button type="button" class="close" (click)='hideComponent("modal-new")'>
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <input type="hidden" id="new-node" name="new-node" value="">
            <div class="modal-body" id="new-value">
                <label for="newkeyname">이름:</label>
                <input #newkeyname type="text" class="form-control" id="new-key-name" name="new-key-name" placeholder="name">
                <label for="newkeynamespace">네임스페이스:</label>
                <select #newkeynamespace class="custom-select rounded-0" name="new-key-namespace" id="new-key-namespace">
                    <option>Value 1</option>
                </select>
                <label for="newkeyvalue">값:</label>
                <textarea #newkeyvalue class="form-control" rows="3" cols="10" id="new-key-value" name="new-key-value"></textarea>
            </div>
            <div class="modal-footer justify-content-between">
              <button type="button" class="btn btn-default" (click)='hideComponent("modal-new")'>닫기</button>
              <button type="button" class="btn btn-primary" (click)="applyNew(newkeyname.value, newkeynamespace.value, newkeyvalue.value)">생성</button>
            </div>
          </div>
          <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
      </div>

        <!--               -->
        <!-- Modal: Delete -->
        <!--               -->
        <div class="modal fade" id="modal-delete" style="display: none;" aria-hidden="true">
            <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                <h4 class="modal-title" id="delete-title">TITLE_TEMPLATE</h4>
                <button type="button" class="close" (click)='hideComponent("modal-delete")'>
                    <span aria-hidden="true">×</span>
                </button>
                </div>
                <input type="hidden" id="delete-namespace" name="delete-namespace" value="">
                <input type="hidden" id="delete-name" name="delete-name" value="">
                <div class="modal-body" id="delete-value">
                <p>BODY_TEMPLATE</p>
                </div>
                <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-default" (click)='hideComponent("modal-delete")'>닫기</button>
                <button type="button" class="btn btn-danger" (click)="applyDelete()">삭제</button>
                </div>
            </div>
            <!-- /.modal-content -->
            </div>
            <!-- /.modal-dialog -->
        </div>


    </div>
</div>
