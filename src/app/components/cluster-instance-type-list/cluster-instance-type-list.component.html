<div class="content">
    <div class="container-fluid">
      <div class="content-wrapper">
        &nbsp;<br>
        <div class="card card-outline">
          <div class="card-header">
            <h3 class="card-title">
              <i class="fas fa-clipboard"></i>
              &nbsp;&nbsp;클러스터 인스턴스 유형
            </h3>
            <div class="card-tools">
              <button type="button" data-placement="bottom" data-toggle="tooltip" data-original-title="새로고침..." title="새로고침..." class="btn btn-tool" (click)="fullReload()">
                  <i class="fas fa-sync" (click)="fullReload()" title="새로고침..."></i>
              </button>
              <button type="button" data-placement="bottom" data-toggle="tooltip" data-original-title="새 유형..." title="새 유형..." class="btn btn-tool" (click)="showNew()">
                <i class="fas fa-plus-square" (click)="showNew()" title="새 유형..."></i>
            </button>
            </div>
          </div>
          <div class="card-body">
           <table datatable id="citList_datatable" [dtOptions]="citList_dtOptions" [dtTrigger]="citList_dtTrigger" class="table table-sm" style="vertical-align: middle !important;">
              <thead>
                <tr>
                  <th style="width: 10px">&nbsp;</th>
                  <th style="width: 180px">이름</th>
                  <th style="width: 100px">CPU</th>
                  <th style="width: 100px">메모리</th>
                  <th style="width: 80px">&nbsp;</th>
                </tr>
              </thead>
              <tbody>
                  <tr *ngFor="let thisType of clusterInstanceTypeList">
                    <td style="line-height: 2.2 !important; align-content: center;"><i class="fas fa-clipboard"></i></td>
                    <td style="line-height: 2.2 !important;">{{thisType.name}}</td>
                    <td style="line-height: 2.2 !important;">{{thisType.cpu}}</td>
                    <td style="line-height: 2.2 !important;">{{thisType.memory}}</td>
                    <td style="line-height: 0 !important;">
                        <div class="dropdown">
                            <button class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" href="#" aria-expanded="false">작업</button>
                            <div class="dropdown-menu">
                                <!--- EDIT BUTTON -->
                                <a class="btn" (click)="showEdit(thisType.name)" title="편집...">
                                    <i class="fas fa-pen"></i>
                                </a>
                                <!--- DELETE BUTTON -->
                                <a class="btn" (click)="showDelete(thisType.name)" title="삭제...">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </div>
                    </td>
                  </tr>
              </tbody>
            </table>
          </div>
          <!-- /.card-body -->
        </div>
      </div>

      <!--               -->
      <!-- Modal: EDIT   -->
      <!--               -->
      <div class="modal fade" id="modal-edit" style="display: none;" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title" id="edit-title">TITLE_TEMPLATE</h4>
              <button type="button" class="close" (click)='hideComponent("modal-edit")'>
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <div class="modal-body" id="edit-value">
              <div class="form-group">
                <input type="hidden" id="edit-type" name="edit-type" value="">
                <label for="editCPU">CPU</label>
                <input #cpuinput type="number" class="form-control" id="edit-cpu" name="edit-cpu" placeholder="0">
                <label for="editMemory">메모리 (GB)</label>
                <input #memoryinput type="text" class="form-control" id="edit-memory" name="edit-memory" placeholder="0">
              </div>
            </div>
            <div class="modal-footer justify-content-between">
              <button type="button" class="btn btn-default" (click)='hideComponent("modal-edit")'>닫기</button>
              <button type="button" class="btn btn-primary" (click)="applyEdit(cpuinput.value, memoryinput.value)">저장</button>
            </div>
          </div>
          <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
      </div>

      <!--            -->
      <!-- Modal: New -->
      <!--            -->
      <div class="modal fade" id="modal-new" style="display: none;" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title" id="new-title">TITLE_TEMPLATE</h4>
              <button type="button" class="close" (click)='hideComponent("modal-new")'>
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <input type="hidden" id="new-node" name="new-node" value="">
            <div class="modal-body" id="new-value">
                <label for="newTypeName">인스턴스 유형 이름</label>
                <input #newtypename type="text" class="form-control" id="new-type-name" name="new-type-name" placeholder="my-new-type">
                <label for="newTypeCpu">CPU:</label>
                <input #newtypecpu type="number" class="form-control" id="new-type-cpu" name="new-type-cpu" placeholder="0">
                <label for="newTypeName">메모리 (GB):</label>
                <input #newtypememory type="text" class="form-control" id="new-type-memory" name="new-type-memory" placeholder="my-new-memory">
            </div>
            <div class="modal-footer justify-content-between">
              <button type="button" class="btn btn-default" (click)='hideComponent("modal-new")'>닫기</button>
              <button type="button" class="btn btn-primary" (click)="applyNew(newtypename.value, newtypecpu.value, newtypememory.value)">생성</button>
            </div>
          </div>
          <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
      </div>

      <!--               -->
      <!-- Modal: Delete -->
      <!--               -->
      <div class="modal fade" id="modal-delete" style="display: none;" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title" id="delete-title">TITLE_TEMPLATE</h4>
              <button type="button" class="close" (click)='hideComponent("modal-delete")'>
                <span aria-hidden="true">×</span>
              </button>
            </div>
            <input type="hidden" id="delete-type" name="delete-type" value="">
            <div class="modal-body" id="delete-value">
              <p>BODY_TEMPLATE</p>
            </div>
            <div class="modal-footer justify-content-between">
              <button type="button" class="btn btn-default" (click)='hideComponent("modal-delete")'>닫기</button>
              <button type="button" class="btn btn-danger" (click)="applyDelete()">삭제</button>
            </div>
          </div>
          <!-- /.modal-content -->
        </div>
        <!-- /.modal-dialog -->
      </div>
    </div>
  </div>
